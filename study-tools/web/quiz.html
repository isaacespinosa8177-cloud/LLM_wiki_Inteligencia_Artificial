, "question": "Chess played with a clock is…", "options": ["dynamic", "static", "semidynamic", "stochastic"], "correct": 2, "explanation": "The board does not change while you think, but your performance score (time) does.", "see": "concepts/task-environments.md"}, {"id": "unit1-5", "unit": "unit1", "question": "Which environment is episodic?", "options": ["Chess", "Taxi driving", "Classifying defective parts on an assembly line, one image at a time", "Poker"], "correct": 2, "explanation": "Each classification decision does not affect the next one.", "see": "concepts/task-environments.md"}, {"id": "unit1-6", "unit": "unit1", "question": "Which agent fails in a partially observable environment because it has no memory?", "options": ["Simple reflex agent", "Model-based reflex agent", "Goal-based agent", "Utility-based agent"], "correct": 0, "explanation": "It only uses the current percept; a model-based agent keeps an internal state.", "see": "concepts/agent-types.md"}, {"id": "unit1-7", "unit": "unit1", "question": "What does a utility-based agent add over a goal-based agent?", "options": ["Memory of the past", "The ability to plan", "A numeric measure that ranks outcomes, handling trade-offs and uncertainty", "Sensors"], "correct": 2, "explanation": "Goals are binary (achieved or not); utility distinguishes better from worse ways to reach them.", "see": "concepts/agent-types.md"}, {"id": "unit1-8", "unit": "unit1", "question": "In a learning agent, which component suggests exploratory actions?", "options": ["Critic", "Learning element", "Performance element", "Problem generator"], "correct": 3, "explanation": "The problem generator proposes new, informative experiences, even if they look suboptimal now.", "see": "concepts/agent-types.md"}, {"id": "unit1-9", "unit": "unit1", "question": "The 8-puzzle stored as a tuple (2,4,3,1,0,6,7,5,8) is a … representation.", "options": ["atomic", "factored", "structured", "relational"], "correct": 1, "explanation": "It is a vector of variable values, which lets heuristics like Manhattan distance look inside the state.", "see": "concepts/state-representation.md"}, {"id": "unit1-10", "unit": "unit1", "question": "Who created Prolog?", "options": ["Dennis Ritchie at Bell Labs", "John McCarthy at MIT", "Alain Colmerauer and Philippe Roussel in Marseille, building on Kowalski's theory", "Alan Turing"], "correct": 2, "explanation": "Slide 9 of the intro deck wrongly credits Ritchie (who created C). Prolog: Marseille, 1972.", "see": "study/errata.md"}, {"id": "unit1-11", "unit": "unit1", "question": "In which year was the Dartmouth workshop that named the field of AI?", "options": ["1950", "1956", "1958", "1972"], "correct": 1, "explanation": "McCarthy, Minsky, Rochester and Shannon organized it in 1956.", "see": "concepts/history-of-ai.md"}, {"id": "unit1-12", "unit": "unit1", "question": "Why can a single perceptron not learn XOR?", "options": ["It has too few weights", "XOR is not linearly separable", "It has no bias term", "Backpropagation does not converge for XOR"], "correct": 1, "explanation": "A perceptron draws one straight line; XOR needs a hidden layer.", "see": "concepts/neural-networks.md"}, {"id": "unit2-13", "unit": "unit2", "question": "Which frontier gives breadth-first search?", "options": ["LIFO stack", "FIFO queue", "Priority queue ordered by h", "Priority queue ordered by g + h"], "correct": 1, "explanation": "BFS expands the shallowest node first: new nodes go to the back of a FIFO queue.", "see": "concepts/uninformed-search.md"}, {"id": "unit2-14", "unit": "unit2", "question": "What is the main practical problem of BFS?", "options": ["It is not complete", "It is not optimal with equal costs", "It needs O(b^d) memory", "It loops forever on cycles"], "correct": 2, "explanation": "At b = 10, d = 10 it needs about 10 terabytes; memory hurts more than time.", "see": "concepts/uninformed-search.md"}, {"id": "unit2-15", "unit": "unit2", "question": "Space complexity of depth-first e node with the smallest…", "options": ["h(n)", "g(n)", "g(n) + h(n)", "depth"], "correct": 2, "explanation": "f(n) = g(n) + h(n) estimates the cost of the cheapest solution through n.", "see": "concepts/a-star-search.md"}, {"id": "unit2-21", "unit": "unit2", "question": "With h(n) = 0 for every node, A* behaves like…", "options": ["greedy best-first search", "uniform-cost search (Dijkstra)", "depth-first search", "hill climbing"], "correct": 1, "explanation": "f = g, so it expands by path cost only.", "see": "concepts/a-star-search.md"}, {"id": "unit2-22", "unit": "unit2", "question": "For the 8-puzzle, why prefer Manhattan distance over misplaced tiles?", "options": ["Manhattan is not admissible", "Both are admissible and Manhattan dominates (is always ≥), so A* expands fewer nodes", "Misplaced tiles is not admissible", "Manhattan is cheaper to compute"], "correct": 1, "explanation": "AIMA Fig. 3.26: at depth 20, A*(h1) generates 9,905 nodes, A*(h2) only 1,318.", "see": "concepts/heuristics.md"}, {"id": "unit2-23", "unit": "unit2", "question": "Minimax time and space complexity are…", "options": ["O(b^d) and O(b^d)", "O(b^m) and O(b·m)", "O(b^(m/2)) and O(m)", "O(m) and O(b)"], "correct": 1, "explanation": "It is a depth-first exploration of the whole game tree.", "see": "concepts/adversarial-search-minimax.md"}, {"id": "unit2-24", "unit": "unit2", "question": "With perfect move ordering, alpha–beta examines…", "options": ["O(b^m) nodes, like minimax", "O(b^(m/2)) nodes", "O(b·m) nodes", "O(log b^m) nodes"], "correct": 1, "explanation": "The effective branching factor becomes √b, so it can search about twice as deep.", "see": "concepts/alpha-beta-pruning.md"}, {"id": "unit2-25", "unit": "unit2", "question": "MAX's three MIN children have leaves [4, 8, 9], [3, 7, 1], [6, 2, 5]. How many leaves does alpha–beta prune?", "options": ["0", "2", "3", "5"], "correct": 2, "explanation": "After the first child α = 4: in the second child 3 < 4 prunes 7 and 1; in the third, 2 < 4 prunes 5.", "see": "study/practice-unit-2-search.md"}, {"id": "unit2-26", "unit": "unit2", "question": "Why does Go use Monte Carlo tree search instead of heuristic alpha–beta?", "options": ["Go has hidden information", "Go is stochastic", "Its branching factor is huge (361 at the start) and good evaluation functions are hard to write", "Alpha–beta cannot handle two players"], "correct": 2, "explanation": "MCTS evaluates positions by averaging playouts and needs only the rules.", "see": "concepts/monte-carlo-tree-search.md"}, {"id": "unit2-27", "unit": "unit2", "question": "In expectiminimax, a chance node returns…", "options": ["the maximum of its children", "the minimum of its children", "the probability-weighted average of its children", "a random child's value"], "correct": 2, "explanation": "Σ P(r)·value(r).", "see": "concepts/stochastic-and-partially-observable-games.md"}, {"id": "unit2-28", "unit": "unit2", "question": "The MRV heuristic chooses…", "options": ["the value that rules out the fewest options", "the variable with the fewest legal values left", "the variable with the most constraints", "a random variable"], "correct": 1, "explanation": "Minimum remaining values = fail-first. Value ordering is LCV; degree is the tie-breaker.", "see": "concepts/constraint-satisfaction-problems.md"}, {"id": "unit2-29", "unit": "unit2", "question": "Forward checking, after assigning X, …", "options": ["runs AC-3 on the whole CSP", "removes from each unassigned neighbor of X the values inconsistent with X", "assigns all neighbors of X", "jumps back to the most recent conflicting variable"], "correct": 1, "explanation": "It enforces arc consistency only for X and does not propagate further (MAC does).", "see": "concepts/constraint-satisfaction-problems.md"}, {"id": "unit2-30", "unit": "unit2", "question": "A tree-structured CSP with n variables and domain size d can be solved in…", "options": ["O(d^n)", "O(n!)", "O(n·d²)", "O(n²·d)"], "correct": 2, "explanation": "Directional arc consistency from the leaves, then assign from the root without backtracking.", "see": "concepts/constraint-satisfaction-problems.md"}, {"id": "unit2-31", "unit": "unit2", "question": "On the hard HW01 Sudoku, naive backtracking made 335,637 assignments. Forward checking + MRV made…", "options": ["4,036", "309", "51", "335,000"], "correct": 1, "explanation": "MRV alone made 4,036; adding forward checking detects empty domains before recursing.", "see": "assignments/deber-1-search-problems.md"}, {"id": "unit3-32", "unit": "unit3", "question": "A Horn clause has…", "options": ["exactly one negative literal", "at most one positive literal", "no positive literals", "exactly two literals"], "correct": 1, "explanation": "Definite clause = exactly one positive (a rule); goal clause = none (a query).", "see": "concepts/horn-clauses-and-backward-chaining.md"}, {"id": "unit3-33", "unit": "unit3", "question": "Which clause is NOT a Horn clause?", "options": ["¬A ∨ ¬B ∨ C", "C", "¬A ∨ ¬B", "A ∨ B"], "correct": 3, "explanation": "Two positive literals; Prolog cannot say \"one of these, I don't know which\".", "see": "concepts/horn-clauses-and-backward-chaining.md"}, {"id": "unit3-34", "unit": "unit3", "question": "The CNF of (A ⇒ B) ⇒ C is…", "options": ["(¬A ∨ B) ∧ C", "(A ∨ C) ∧ (¬B ∨ C)", "¬A ∨ B ∨ C", "(A ∧ ¬B) ∧ C"], "correct": 1, "explanation": "¬(¬A ∨ B) ∨ C = (A ∧ ¬B) ∨ C, then distribute.", "see": "study/practice-unit-3-logic.md"}, {"id": "unit3-35", "unit": "unit3", "question": "First-order logic is…", "options": ["decidable", "semi-decidable", "only able to talk about true/false symbols", "the same as propositional logic"], "correct": 1, "explanation": "If KB ⊨ α a complete procedure finds the proof; if not, it may never stop.", "see": "concepts/propositional-and-first-order-logic.md"}, {"id": "unit3-36", "unit": "unit3", "question": "In Prolog, parent(Hector, ana) means…", "options": ["Hector (the constant) is a parent of ana", "some X is a parent of ana (Hector is a variable)", "a syntax error", "ana is a parent of Hector"], "correct": 1, "explanation": "Uppercase = variable, the opposite of the textbook's convention.", "see": "concepts/prolog.md"}, {"id": "unit3-37", "unit": "unit3", "question": "Result of ?- f(X, g(X)) = f(Y, g(a)).", "options": ["false", "X = Y", "X = a, Y = a", "X = g(a)"], "correct": 2, "explanation": "X unifies with Y, then g(X) with g(a) forces X = a.", "see": "concepts/unification.md"}, {"id": "unit3-38", "unit": "unit3", "question": "?- X = 2 + 3. gives…", "options": ["X = 2+3", "X = 5", "false", "an instantiation error"], "correct": 0, "explanation": "= unifies terms and evaluates nothing; is evaluates.", "see": "concepts/unification.md"}, {"id": "unit3-39", "unit": "unit3", "question": "?- X is Y + 1. with Y unbound gives…", "options": ["X = Y+1", "false", "an \"arguments are not sufficiently instantiated\" error", "X = 1"], "correct": 2, "explanation": "is/2 needs its right-hand side fully bound.", "see": "concepts/prolog.md"}, {"id": "unit3-40", "unit": "unit3", "question": "How does Prolog choose which goal and clause to try?", "options": ["Rightmost goal, last clause first", "Leftmost goal, clauses top to bottom, depth-first with backtracking", "Breadth-first over all clauses", "Random choice"], "correct": 1, "explanation": "SLD resolution with Prolog's search rule: depth-first, left to right.", "see": "concepts/prolog.md"}, {"id": "unit3-41", "unit": "unit3", "question": "Why can path(X,Z) :- path(X,Y), link(Y,Z). (written first) loop forever?", "options": ["link/2 is missing", "It is left-recursive: path calls path before consuming anything", "Prolog has no recursion", "Because of the cut"], "correct": 1, "explanation": "Put the base case first and recurse on the right, or use :- table path/2.", "see": "concepts/prolog.md"}, {"id": "unit3-42", "unit": "unit3", "question": "\\+ parent(X, ana) with X unbound returns false because…", "options": ["nobody is ana's parent", "some X is ana's parent, so the goal succeeds and its negation fails", "negation is not allowed in Prolog", "X must be uppercase"], "correct": 1, "explanation": "Negation as failure only behaves like logical negation on ground (bound) goals.", "see": "concepts/prolog.md"}, {"id": "unit3-43", "unit": "unit3", "question": "Why is the naive fibo/2 slow?", "options": ["Prolog integers are slow", "Each call makes two recursive calls and recomputes the same subproblems (exponential)", "It uses is/2", "It is tail-recursive"], "correct": 1, "explanation": "An accumulator version is linear; tabling also fixes it.", "see": "concepts/prolog-recursion-and-lists.md"}, {"id": "unit3-44", "unit": "unit3", "question": "isPerm([1,1,2],[1,2,2]) returns true because isPerm checks…", "options": ["length only", "set equality (each element appears in the other list), not permutation", "sorted order", "nothing — it is correct"], "correct": 1, "explanation": "Fix: msort(X, S), msort(Y, S).", "see": "concepts/prolog-recursion-and-lists.md"}, {"id": "unit3-45", "unit": "unit3", "question": "findall(D, ancestor(hector, D), L) with the lecture's family.pl gives…", "options": ["[sofia, diego, ana, luis]", "[ana, luis, sofia, diego]", "[ana, sofia, luis, diego]", "[]"], "correct": 1, "explanation": "The first ancestor clause (direct parent) gives the children first; the recursive clause adds the grandchildren.", "see": "study/practice-unit-3-logic.md"}, {"id": "unit4-46", "unit": "unit4", "question": "Hill climbing gets stuck because of…", "options": ["its memory use", "local maxima, ridges and plateaus", "its random moves", "its population size"], "correct": 1, "explanation": "It never accepts a worse move; on random 8-queens it solves only 14% of instances.", "see": "concepts/local-search-hill-climbing.md"}, {"id": "unit4-47", "unit": "unit4", "question": "Simulated annealing accepts a worse move with probability…", "options": ["Δ / T", "e^(−Δ/T)", "1 − T", "always 0.5"], "correct": 1, "explanation": "At high T almost everything is accepted; as T → 0 it becomes hill climbing.", "see": "concepts/simulated-annealing.md"}, {"id": "unit4-48", "unit": "unit4", "question": "Gradient descent on f = (x−2)² + (y+2)² from (0,0) with η = 0.1: the first step lands on…", "options": ["(0.2, −0.2)", "(0.4, −0.4)", "(4, −4)", "(2, −2)"], "correct": 1, "explanation": "∇f(0,0) = (−4, 4); w ← w − 0.1·(−4, 4).", "see": "study/practice-unit-4-optimization.md"}, {"id": "unit4-49", "unit": "unit4", "question": "In a GA, which operator is mainly responsible for combining good building blocks?", "options": ["Mutation", "Crossover", "Selection", "Elitism"], "correct": 1, "explanation": "Holland: crossover recombines schemata; mutation is an insurance that keeps diversity.", "see": "concepts/genetic-algorithms.md"}, {"id": "unit4-50", "unit": "unit4", "question": "One-point crossover of 110|10110 and 001|11001 gives…", "options": ["11011001 and 00110110", "11010110 and 00111001", "00110110 and 11010110", "11111111 and 00000000"], "correct": 0, "explanation": "Swap the tails after position 3.", "see": "study/practice-unit-4-optimization.md"}, {"id": "unit4-51", "unit": "unit4", "question": "With 16 bits and a per-bit mutation rate of 0.1, how many bits flip per child on average?", "options": ["0.1", "1", "1.6", "16"], "correct": 2, "explanation": "L·p_m = 16 × 0.1. The usual choice is about 1/L.", "see": "concepts/ea-representation-and-variation.md"}, {"id": "unit4-52", "unit": "unit4", "question": "Which selection method is invariant to adding a constant to the fitness?", "options": ["Fitness-proportional (roulette)", "Tournament selection", "Both", "Neither"], "correct": 1, "explanation": "Tournaments only compare individuals; roulette probabilities change when f is shifted.", "see": "concepts/ea-selection-and-population-management.md"}, {"id": "unit4-53", "unit": "unit4", "question": "What does elitism guarantee?", "options": ["Faster mutation", "The best fitness in the population never decreases", "More diversity", "That the global optimum is found"], "correct": 1, "explanation": "The current best individual is always copied into the next generation.", "see": "concepts/ea-selection-and-population-management.md"}, {"id": "unit4-54", "unit": "unit4", "question": "Which operator keeps a permutation valid?", "options": ["One-point crossover", "Bit-flip mutation", "Order crossover (OX)", "Arithmetic crossover"], "correct": 2, "explanation": "Plain one-point crossover can duplicate values; OX, PMX, cycle and edge crossover are designed for permutations.", "see": "concepts/ea-representation-and-variation.md"}, {"id": "unit4-55", "unit": "unit4", "question": "In PSO, the term c₂·r₂·(g_best − x) is called…", "options": ["inertia", "the cognitive component", "the social component", "mutation"], "correct": 2, "explanation": "It pulls the particle toward the best position found by the whole swarm.", "see": "concepts/particle-swarm-optimization.md"}, {"id": "unit4-56", "unit": "unit4", "question": "What did Kennedy & Eberhart find when they removed the previous velocity (momentum) from the update?", "options": ["It converged faster", "It became quite ineffective at finding global optima", "Nothing changed", "It became a genetic algorithm"], "correct": 1, "explanation": "Momentum makes particles overshoot, which is how the swarm explores.", "see": "concepts/particle-swarm-optimization.md"}, {"id": "unit4-57", "unit": "unit4", "question": "In Ant System, an ant at city i moves to j with probability proportional to…", "options": ["d_ij", "τ_ij only", "τ_ij^α · (1/d_ij)^β", "1/L_k"], "correct": 2, "explanation": "Pheromone (learned) times visibility (greedy heuristic), over the allowed cities.", "see": "concepts/ant-colony-optimization.md"}, {"id": "unit4-58", "unit": "unit4", "question": "Why does ACO evaporate pheromone?", "options": ["To save memory", "To forget bad choices and avoid stagnation (unlimited accumulation)", "To speed up each ant", "Because ants die"], "correct": 1, "explanation": "Positive feedback alone would make all ants follow the same early tour.", "see": "concepts/ant-colony-optimization.md"}, {"id": "unit4-59", "unit": "unit4", "question": "In Artificial Bee Colony, which bees provide exploration?", "options": ["Employed bees", "Onlooker bees", "Scout bees", "Queen bees"], "correct": 2, "explanation": "Scouts replace sources that have not improved for limit trials with random new ones.", "see": "concepts/artificial-bee-colony.md"}, {"id": "unit4-60", "unit": "unit4", "question": "Best choice for the shortest tour through 50 cities?", "options": ["Gradient descent", "Ant colony optimization (or a GA with permutation operators)", "Perceptron training", "Minimax"], "correct": 1, "explanation": "It is a combinatorial problem on a graph; 1/d is a natural heuristic.", "see": "study/metaheuristics-comparison.md"}]</script>
<script>
(function () {
  const QUESTIONS = JSON.parse(document.getElementById("quiz-data").textContent);
  const UNIT_NAMES = { unit1: "Unit 1 · Agents", unit2: "Unit 2 · Search & games", unit3: "Unit 3 · Logic & Prolog", unit4: "Unit 4 · Optimization" };
  const store = {
    get(k, d) { try { const v = localStorage.getItem("iaquiz:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("iaquiz:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const $ = (id) => document.getElementById(id);
  let selected = new Set(store.get("units", Object.keys(UNIT_NAMES)));
  let missed = new Set(store.get("missed", []));
  let round = [], idx = 0, correct = 0, wrongs = [], answered = false;

  function renderUnits() {
    const box = $("units"); box.innerHTML = "";
    Object.entries(UNIT_NAMES).forEach(([k, name]) => {
      const n = QUESTIONS.filter(q => q.unit === k).length;
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = `${name} (${n})`;
      b.setAttribute("aria-pressed", selected.has(k));
      b.onclick = () => { selected.has(k) ? selected.delete(k) : selected.add(k); if (!selected.size) selected.add(k); store.set("units", [...selected]); renderUnits(); };
      box.appendChild(b);
    });
    $("missedMode").textContent = `Only my mistakes (${[...missed].filter(id => QUESTIONS.some(q => q.id === id)).length})`;
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function start(onlyMissed) {
    let pool = QUESTIONS.filter(q => selected.has(q.unit));
    if (onlyMissed) pool = pool.filter(q => missed.has(q.id));
    if (!pool.length) { pool = QUESTIONS.filter(q => selected.has(q.unit)); }
    const n = $("count").value === "all" ? pool.length : Math.min(+$("count").value, pool.length);
    round = shuffle(pool.slice()).slice(0, n).map(q => ({ ...q, order: shuffle(q.options.map((_, i) => i)) }));
    idx = 0; correct = 0; wrongs = [];
    $("result").hidden = true; $("quiz").hidden = false;
    show();
  }
  function show() {
    const q = round[idx]; answered = false;
    $("pos").textContent = `${idx + 1} / ${round.length}`;
    $("live").textContent = `${correct} correct`;
    $("bar").style.width = `${(idx / round.length) * 100}%`;
    $("qtag").textContent = UNIT_NAMES[q.unit];
    $("qtext").textContent = q.question;
    $("fb").hidden = true; $("next").hidden = true;
    const box = $("opts"); box.innerHTML = "";
    q.order.forEach((oi, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.dataset.oi = oi;
      b.innerHTML = `<span class="k">${String.fromCharCode(65 + k)}</span><span></span>`;
      b.lastChild.textContent = q.options[oi];
      b.onclick = () => answer(oi);
      box.appendChild(b);
    });
  }
  function answer(oi) {
    if (answered) return; answered = true;
    const q = round[idx], ok = oi === q.correct;
    if (ok) { correct++; missed.delete(q.id); } else { wrongs.push({ q, oi }); missed.add(q.id); }
    store.set("missed", [...missed]);
    [...$("opts").children].forEach(b => {
      b.disabled = true;
      if (+b.dataset.oi === q.correct) b.classList.add("ok");
      else if (+b.dataset.oi === oi) b.classList.add("bad");
    });
    const fb = $("fb"); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.hidden = false;
    fb.innerHTML = `<strong></strong><span></span><span class="see"></span>`;
    fb.children[0].textContent = ok ? "Correct." : `Not quite. Answer: ${q.options[q.correct]}`;
    fb.children[1].textContent = q.explanation;
    fb.children[2].textContent = q.see ? `Wiki → ${q.see}` : "";
    $("live").textContent = `${correct} correct`;
    $("next").hidden = false; $("next").textContent = idx + 1 < round.length ? "Next question" : "See results";
    $("next").focus({ preventScroll: true });
  }
  function next() { if (!answered) return; idx++; idx < round.length ? show() : finish(); }
  function finish() {
    $("bar").style.width = "100%"; $("quiz").hidden = true; $("result").hidden = false;
    const pct = Math.round((correct / round.length) * 100);
    $("rtitle").textContent = `${correct} of ${round.length} correct (${pct}%)`;
    const byUnit = {};
    round.forEach(q => { byUnit[q.unit] = byUnit[q.unit] || [0, 0]; byUnit[q.unit][1]++; });
    round.forEach(q => { if (!wrongs.some(w => w.q.id === q.id)) byUnit[q.unit][0]++; });
    const best = store.get("best", {});
    $("rscore").innerHTML = "";
    Object.entries(byUnit).forEach(([u, [c, t]]) => {
      const p = Math.round((c / t) * 100); best[u] = Math.max(best[u] || 0, p);
      const d = document.createElement("div");
      d.innerHTML = `<span></span><b>${c}/${t}</b><span>best this device: ${best[u]}%</span>`;
      d.firstChild.textContent = UNIT_NAMES[u]; $("rscore").appendChild(d);
    });
    store.set("best", best);
    const list = $("rlist"); list.innerHTML = "";
    wrongs.forEach(({ q, oi }) => {
      const a = document.createElement("article");
      a.innerHTML = `<div class="qtag"></div><strong></strong><span></span><span></span><span class="see"></span>`;
      a.children[0].textContent = UNIT_NAMES[q.unit];
      a.children[1].textContent = q.question;
      a.children[2].textContent = `You answered: ${q.options[oi]} · Correct: ${q.options[q.correct]}`;
      a.children[3].textContent = q.explanation;
      a.children[4].textContent = q.see ? `Wiki → ${q.see}` : "";
      list.appendChild(a);
    });
    $("redo").hidden = !wrongs.length;
    renderUnits();
  }
  $("start").onclick = () => start($("missedMode").getAttribute("aria-pressed") === "true");
  $("again").onclick = () => start(false);
  $("redo").onclick = () => start(true);
  $("next").onclick = next;
  $("missedMode").onclick = (e) => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); };
  document.addEventListener("keydown", (e) => {
    if ($("quiz").hidden) return;
    if (/^[1-4]$/.test(e.key) && !answered) { const b = $("opts").children[+e.key - 1]; if (b) b.click(); }
    else if (e.key === "Enter" && answered) { e.preventDefault(); next(); }
  });
  renderUnits();
  start(false);
})();
</script>
